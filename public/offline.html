<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline — Salon Central</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: #faf9fc; color: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 380px; text-align: center; background: #fff; border: 1px solid #e3e0eb;
    border-radius: 18px; padding: 32px 24px; box-shadow: 0 8px 28px rgba(38,25,75,.06);
  }
  img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 16px; }
  h1 { margin: 0 0 8px; font-size: 20px; }
  p  { margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #777790; }
  button {
    border: none; border-radius: 12px; padding: 12px 22px; cursor: pointer;
    background: #7C3AED; color: #fff; font-size: 14px; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>We couldn't reach Salon Central. Check your connection and try again — your saved notifications will still arrive once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
